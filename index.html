<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 固定幅デザイン（レスポンシブ非対応指定） -->
    <meta name="viewport" content="width=1280">
    <title>海のサインプロジェクト - 管理ダッシュボード</title>

    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* レスポンシブ非対応用の固定幅コンテナ */
        .fixed-layout {
            width: 1200px;
            min-width: 1200px;
            margin: 0 auto;
        }

        /* 🌈 背景グラデーションアニメーション */
        body {
            background: linear-gradient(-45deg, #0c4a6e, #075985, #0284c7, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: auto; /* スマホ等では横スクロールさせる */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 💎 浮遊する背景オブジェクト (Keyframes) */
        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            filter: blur(1px);
        }

        /* クリスタル（菱形） */
        .crystal {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(56,189,248,0.3));
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 32px 0 rgba(0, 191, 255, 0.37);
        }

        /* 浮遊キーフレームアニメーション */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-25px) rotate(15deg) scale(1.05); }
        }

        @keyframes floatFast {
            0%, 100% { transform: translateY(0px) rotate(45deg) scale(1); }
            50% { transform: translateY(-40px) rotate(60deg) scale(1.1); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(30px) rotate(-20deg); }
        }

        .anim-float-1 { animation: floatSlow 8s ease-in-out infinite; }
        .anim-float-2 { animation: floatFast 6s ease-in-out infinite; }
        .anim-float-3 { animation: floatReverse 10s ease-in-out infinite; }

        /* ガラスモーフィズム風 UI */
        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col justify-between">

    <!-- 🔮 背景浮遊オブジェクト（クリスタル・図形） -->
    <div class="bg-shape crystal anim-float-1" style="top: 10%; left: 5%; width: 60px; height: 60px;"></div>
    <div class="bg-shape crystal anim-float-2" style="top: 60%; left: 8%; width: 40px; height: 40px;"></div>
    <div class="bg-shape crystal anim-float-3" style="top: 20%; right: 7%; width: 80px; height: 80px;"></div>
    <div class="bg-shape crystal anim-float-1" style="bottom: 15%; right: 12%; width: 50px; height: 50px;"></div>
    
    <!-- 丸型・グラデーションオブジェクト -->
    <div class="bg-shape rounded-full bg-gradient-to-r from-cyan-400/30 to-blue-600/30 anim-float-3" style="top: 40%; left: 85%; width: 120px; height: 120px; filter: blur(20px);"></div>
    <div class="bg-shape rounded-full bg-gradient-to-r from-teal-300/30 to-sky-500/30 anim-float-2" style="bottom: 10%; left: 20%; width: 160px; height: 160px; filter: blur(25px);"></div>


    <!-- 🌐 HEADER -->
    <header class="glass-panel sticky top-0 z-30 shadow-md">
        <div class="fixed-layout h-16 flex items-center justify-between px-4">
            <div class="flex items-center space-x-3 shrink-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="waves" class="w-6 h-6"></i>
                </div>
                <span class="font-bold text-xl text-slate-800 tracking-tight">
                    海のサインプロジェクト <span class="text-xs text-brand-600 font-normal border border-brand-200 bg-brand-50 px-2 py-0.5 rounded-full">Dashboard</span>
                </span>
            </div>

            <div class="flex items-center space-x-4 shrink-0">
                <div class="flex items-center space-x-2 bg-slate-100/80 px-3 py-1.5 rounded-full border border-slate-200/80 shadow-inner">
                    <img id="userAvatar" src="https://placehold.co/80x80/0284c7/ffffff?text=U" alt="Avatar" class="w-7 h-7 rounded-full object-cover">
                    <div class="text-left">
                        <div id="userName" class="text-xs font-semibold text-slate-700 max-w-[120px] truncate">ゲスト</div>
                    </div>
                    <span id="roleBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 uppercase">GUEST</span>
                </div>

                <button id="authBtn" onclick="toggleAuthAction()" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 text-white text-xs font-semibold flex items-center space-x-1.5 transition shadow-md">
                    <i id="authBtnIcon" data-lucide="log-in" class="w-4 h-4"></i>
                    <span id="authBtnText">ログイン</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 📊 MAIN CONTAINER -->
    <main class="fixed-layout py-8 flex-1 w-full space-y-6 relative z-10">
        
        <!-- Status Overview Cards -->
        <div class="grid grid-cols-3 gap-6">
            <div class="glass-panel p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">認証状態</p>
                    <p id="authSource" class="text-base font-bold text-slate-700 mt-1 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-400 inline-block shrink-0"></span> 未認証
                    </p>
                </div>
                <div class="p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">アクセス権限</p>
                    <p id="statRoleText" class="text-base font-bold text-slate-700 mt-1">一般</p>
                </div>
                <div class="p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="key-round" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">DB接続状況</p>
                    <p id="apiStatusText" class="text-base font-bold text-slate-700 mt-1">確認中...</p>
                </div>
                <div class="p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="database" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- Controls & Data Section -->
        <div class="glass-panel rounded-2xl shadow-xl p-6">
            <div class="flex items-center justify-between gap-4 mb-6">
                <!-- Navigation Tabs -->
                <div class="flex bg-slate-200/60 p-1.5 rounded-xl border border-slate-300/50">
                    <button id="tabTasksBtn" onclick="switchDataTab('tasks')" class="px-5 py-2 rounded-lg text-xs font-bold bg-white text-brand-600 shadow-md transition">
                        タスク管理
                    </button>
                    <button id="tabHotelsBtn" onclick="switchDataTab('hotels')" class="px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
                        交渉・企業管理
                    </button>
                    <button id="tabLogsBtn" onclick="switchDataTab('logs')" class="px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
                        操作ログ
                    </button>
                </div>

                <!-- Add Button -->
                <button id="addItemBtn" onclick="openCreateModal()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-cyan-600 hover:from-brand-700 hover:to-cyan-700 text-white text-xs font-bold flex items-center space-x-2 transition shadow-lg shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span id="addItemBtnText">新規タスク追加</span>
                </button>
            </div>

            <!-- DATA CONTAINER -->
            <div id="dataContainer" class="min-h-[300px]"></div>
        </div>
    </main>

    <!-- 🔐 LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white/95 w-[380px] rounded-2xl p-6 border border-white/50 shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-lg font-bold text-slate-800 mb-1">システムログイン</h3>
            <p class="text-xs text-slate-500 mb-6">ご利用のアカウントで認証を行ってください。</p>

            <div class="space-y-4">
                <div class="flex justify-center w-full">
                    <div id="g_id_signin_btn" class="w-full flex justify-center"></div>
                </div>

                <button onclick="loginWithLine()" class="w-full py-2.5 rounded-xl bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-xs flex items-center justify-center space-x-2 transition shadow-md">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>LINEでログイン</span>
                </button>

                <div class="pt-3 border-t border-slate-200">
                    <p class="text-[11px] font-medium text-slate-500 mb-2">管理者用パスコード</p>
                    <div class="flex gap-2">
                        <input type="password" id="adminPasscodeInput" placeholder="パスコードを入力" class="flex-1 p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <button onclick="loginWithAdminPasscode()" class="px-4 py-2.5 bg-slate-800 text-white text-xs font-bold rounded-xl hover:bg-slate-900 transition shrink-0">
                            認証
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 📝 CRUD MODAL -->
    <div id="dataModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white/95 w-[480px] rounded-2xl p-6 border border-white/50 shadow-2xl relative max-h-[85vh] flex flex-col">
            <button onclick="closeDataModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 id="modalFormTitle" class="text-lg font-bold text-slate-800 mb-4 shrink-0">データ編集</h3>

            <form id="dataForm" onsubmit="handleFormSubmit(event)" class="space-y-4 overflow-y-auto pr-1 flex-1">
                <input type="hidden" id="formItemType">
                <input type="hidden" id="formItemId">

                <div id="formFieldsContainer" class="space-y-4"></div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-200 sticky bottom-0 bg-white/95">
                    <button type="button" onclick="closeDataModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-xs font-semibold hover:bg-slate-50">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-sky-600 text-white text-xs font-bold shadow-md hover:from-brand-700 hover:to-sky-700">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-slate-900/40 border-t border-white/10 py-4 mt-auto relative z-10 backdrop-blur-sm">
        <div class="fixed-layout text-center text-xs text-slate-300/80">
            &copy; 海のサインプロジェクト Dashboard System
        </div>
    </footer>

    <!-- 📜 JS APPLICATION LOGIC -->
    <script>
        const API_BASE = "https://uminosign.zinn1019t.workers.dev";
        const LIFF_ID = "2011830749-oBGQ72bz";
        const GOOGLE_CLIENT_ID = "988378587809-g9calu17mv9huuidppdjj74ibimuo7vb.apps.googleusercontent.com";

        let currentState = {
            user: null,
            authType: 'guest',
            token: '',
            activeTab: 'tasks',
            tasks: [],
            hotels: [],
            logs: []
        };

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            loadStoredSession();

            await initLiffAndCheckAuth();
            initGoogleAuth();
            await verifySessionWithServer();
            await fetchDashboardData();
        });

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (currentState.token) {
                headers['X-Custom-Auth'] = currentState.token;
                headers['Authorization'] = `Bearer ${currentState.token}`;
            }
            return headers;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getStatusBadgeClass(status) {
            switch (status) {
                case '完了':
                case '合意':
                    return 'bg-emerald-100 text-emerald-700 border border-emerald-200';
                case '進行中':
                case '交渉中':
                    return 'bg-sky-100 text-sky-700 border border-sky-200';
                case '未着手':
                case 'アプローチ前':
                    return 'bg-slate-100 text-slate-600 border border-slate-200';
                case '保留':
                case '見送り':
                    return 'bg-amber-100 text-amber-700 border border-amber-200';
                default:
                    return 'bg-slate-100 text-slate-600 border border-slate-200';
            }
        }

        function initGoogleAuth() {
            if (typeof google === 'undefined' || !google.accounts) return;

            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleCallback,
                auto_prompt: false
            });

            const btnContainer = document.getElementById('g_id_signin_btn');
            if (btnContainer) {
                google.accounts.id.renderButton(btnContainer, {
                    type: 'standard',
                    size: 'large',
                    theme: 'outline',
                    text: 'sign_in_with',
                    shape: 'rectangular',
                    logo_alignment: 'left'
                });
            }
        }

        async function initLiffAndCheckAuth() {
            if (typeof liff === 'undefined' || !LIFF_ID) return;

            try {
                await liff.init({ liffId: LIFF_ID });

                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    const lineAccessToken = liff.getAccessToken();

                    currentState.authType = 'line';
                    currentState.token = `LINE_TOKEN:${lineAccessToken}`;
                    currentState.user = {
                        name: profile.displayName,
                        picture: profile.pictureUrl,
                        role: 'GENERAL'
                    };

                    saveSession();
                    updateUserUI();

                    if (window.location.search) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }
            } catch (err) {
                console.error("LIFF Init / Auth Failed:", err);
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function toggleAuthAction() {
            if (currentState.authType !== 'guest') {
                if (currentState.authType === 'line' && typeof liff !== 'undefined' && liff.isLoggedIn()) {
                    if (liff.isInClient()) {
                        liff.closeWindow();
                        return;
                    } else {
                        liff.logout();
                    }
                }
                currentState.user = null;
                currentState.authType = 'guest';
                currentState.token = '';
                localStorage.removeItem('uminosign_auth');
                updateUserUI();
                fetchDashboardData();
            } else {
                openLoginModal();
            }
        }

        async function verifySessionWithServer() {
            if (!currentState.token) return;
            try {
                const res = await fetch(`${API_BASE}/api/auth/verify`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated && data.user) {
                        currentState.user.role = data.user.role;
                        currentState.user.name = data.user.name || currentState.user.name;
                        if (data.user.avatar_url) currentState.user.picture = data.user.avatar_url;
                        saveSession();
                        updateUserUI();
                    }
                } else if (res.status === 401) {
                    currentState.user = null;
                    currentState.authType = 'guest';
                    currentState.token = '';
                    localStorage.removeItem('uminosign_auth');
                    updateUserUI();
                }
            } catch (err) {
                console.error("Session verification failed:", err);
            }
        }

        async function handleGoogleCallback(response) {
            try {
                const token = `GOOGLE_TOKEN:${response.credential}`;
                currentState.authType = 'google';
                currentState.token = token;

                const verifyRes = await fetch(`${API_BASE}/api/auth/verify`, { headers: getAuthHeaders() });
                if (verifyRes.ok) {
                    const data = await verifyRes.json();
                    currentState.user = {
                        name: data.user.name,
                        picture: data.user.avatar_url,
                        role: data.user.role
                    };
                } else {
                    const base64Url = response.credential.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                    const payload = JSON.parse(jsonPayload);
                    currentState.user = { name: payload.name || payload.email, picture: payload.picture, role: 'GENERAL' };
                }

                saveSession();
                updateUserUI();
                closeLoginModal();
                fetchDashboardData();
                sendLoginLog(currentState.user.name, 'Google');
            } catch (e) {
                console.error("Google Auth Error:", e);
                alert("Googleログイン処理に失敗しました。");
            }
        }

        function loginWithLine() {
            if (typeof liff !== 'undefined') {
                if (!liff.isLoggedIn()) {
                    liff.login();
                }
            } else {
                alert("LIFF SDKが読み込まれていません。");
            }
        }

        async function loginWithAdminPasscode() {
            const passcode = document.getElementById('adminPasscodeInput').value.trim();
            if (!passcode) return;

            const token = `ADMIN:${passcode}`;
            currentState.token = token;

            try {
                const res = await fetch(`${API_BASE}/api/auth/verify`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    currentState.authType = 'admin';
                    currentState.user = {
                        name: data.user.name || '管理者',
                        picture: data.user.avatar_url || 'https://placehold.co/80x80/0f172a/ffffff?text=A',
                        role: data.user.role || 'ADMIN'
                    };
                    saveSession();
                    updateUserUI();
                    closeLoginModal();
                    fetchDashboardData();
                    sendLoginLog(currentState.user.name, 'パスコード認証');
                } else {
                    alert("パスコードが正しくありません。");
                    currentState.token = '';
                }
            } catch (e) {
                alert("認証エラーが発生しました。");
                currentState.token = '';
            }
            document.getElementById('adminPasscodeInput').value = '';
        }

        async function sendLoginLog(userName, loginType) {
            try {
                await fetch(`${API_BASE}/api/logs`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ user_name: userName, login_type: loginType })
                });
            } catch (e) {
                console.error("Log error:", e);
            }
        }

        function saveSession() {
            localStorage.setItem('uminosign_auth', JSON.stringify({
                user: currentState.user,
                authType: currentState.authType,
                token: currentState.token
            }));
        }

        function loadStoredSession() {
            const stored = localStorage.getItem('uminosign_auth');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    currentState.user = parsed.user;
                    currentState.authType = parsed.authType;
                    currentState.token = parsed.token || '';
                    updateUserUI();
                } catch (e) {
                    localStorage.removeItem('uminosign_auth');
                }
            }
        }

        function updateUserUI() {
            const userNameEl = document.getElementById('userName');
            const userAvatarEl = document.getElementById('userAvatar');
            const roleBadgeEl = document.getElementById('roleBadge');
            const authSourceEl = document.getElementById('authSource');
            const statRoleTextEl = document.getElementById('statRoleText');
            const authBtnText = document.getElementById('authBtnText');
            const authBtnIcon = document.getElementById('authBtnIcon');

            if (currentState.authType !== 'guest' && currentState.user) {
                userNameEl.innerText = currentState.user.name || 'ユーザー';
                userAvatarEl.src = currentState.user.picture || 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = currentState.user.role || 'USER';

                const authLabel = currentState.authType === 'google' ? 'Google' : currentState.authType === 'line' ? 'LINE' : 'パスコード';
                authSourceEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shrink-0"></span> ${authLabel} 認証済`;
                statRoleTextEl.innerText = currentState.user.role === 'ADMIN' ? '管理者' : '一般';

                authBtnText.innerText = "ログアウト";
                authBtnIcon.setAttribute('data-lucide', 'log-out');
            } else {
                userNameEl.innerText = 'ゲスト';
                userAvatarEl.src = 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = 'GUEST';

                authSourceEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-slate-400 inline-block shrink-0"></span> 未認証`;
                statRoleTextEl.innerText = '一般';

                authBtnText.innerText = "ログイン";
                authBtnIcon.setAttribute('data-lucide', 'log-in');
            }
            lucide.createIcons();
        }

        async function fetchDashboardData() {
            if (!currentState.token) {
                document.getElementById('apiStatusText').innerText = "要ログイン";
                currentState.tasks = [];
                currentState.hotels = [];
                currentState.logs = [];
                renderDashboardData();
                return;
            }

            try {
                const [tasksRes, hotelsRes, logsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/tasks`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/hotels`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/logs`, { headers: getAuthHeaders() })
                ]);

                if (tasksRes.ok) currentState.tasks = await tasksRes.json();
                if (hotelsRes.ok) currentState.hotels = await hotelsRes.json();
                if (logsRes.ok) currentState.logs = await logsRes.json();

                if (tasksRes.status === 401 || hotelsRes.status === 401) {
                    document.getElementById('apiStatusText').innerText = "再ログインが必要";
                } else {
                    document.getElementById('apiStatusText').innerText = "D1 接続中";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('apiStatusText').innerText = "通信エラー";
            }
            renderDashboardData();
        }

        function switchDataTab(tab) {
            currentState.activeTab = tab;
            const btnTasks = document.getElementById('tabTasksBtn');
            const btnHotels = document.getElementById('tabHotelsBtn');
            const btnLogs = document.getElementById('tabLogsBtn');
            const addBtn = document.getElementById('addItemBtn');
            const addBtnText = document.getElementById('addItemBtnText');

            const activeClass = "px-5 py-2 rounded-lg text-xs font-bold bg-white text-brand-600 shadow-md transition";
            const inactiveClass = "px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition";

            btnTasks.className = tab === 'tasks' ? activeClass : inactiveClass;
            btnHotels.className = tab === 'hotels' ? activeClass : inactiveClass;
            btnLogs.className = tab === 'logs' ? activeClass : inactiveClass;

            if (tab === 'tasks') {
                addBtn.style.display = 'flex';
                addBtnText.innerText = '新規タスク追加';
            } else if (tab === 'hotels') {
                addBtn.style.display = 'flex';
                addBtnText.innerText = '新規企業・ホテル追加';
            } else {
                addBtn.style.display = 'none';
            }

            renderDashboardData();
        }

        function renderDashboardData() {
            const container = document.getElementById('dataContainer');
            const tab = currentState.activeTab;

            if (tab === 'tasks') renderTasksView(container);
            else if (tab === 'hotels') renderHotelsView(container);
            else if (tab === 'logs') renderLogsView(container);
            
            lucide.createIcons();
        }

        function openEditTaskModal(id) {
            const task = currentState.tasks.find(t => String(t.id) === String(id));
            if (!task) return;

            openCreateModal();
            document.getElementById('modalFormTitle').innerText = 'タスクの編集';
            document.getElementById('formItemId').value = id;

            document.getElementById('field_title').value = task.title || '';
            document.getElementById('field_team_assignee').value = task.team_assignee || task.assignee || '';
            document.getElementById('field_due').value = task.due || '';
            document.getElementById('field_status').value = task.status || '未着手';
            document.getElementById('field_description').value = task.description || task.detail || '';
        }

        function openEditHotelModal(id) {
            const hotel = currentState.hotels.find(h => String(h.id) === String(id));
            if (!hotel) return;

            currentState.activeTab = 'hotels';
            openCreateModal();
            document.getElementById('modalFormTitle').innerText = '企業・ホテル情報の編集';
            document.getElementById('formItemId').value = id;

            document.getElementById('field_name').value = hotel.name || '';
            document.getElementById('field_contact_person').value = hotel.contact_person || '';
            document.getElementById('field_our_assignee').value = hotel.our_assignee || '';
            document.getElementById('field_area').value = hotel.area || hotel.location || '';
            document.getElementById('field_status').value = hotel.status || 'アプローチ前';
            document.getElementById('field_notes').value = hotel.notes || hotel.description || '';
        }

        function closeDataModal() {
            document.getElementById('dataModal').classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const itemType = document.getElementById('formItemType').value;
            const itemId = document.getElementById('formItemId').value;

            let bodyData = {};
            if (itemType === 'tasks') {
                bodyData = {
                    title: document.getElementById('field_title').value,
                    team_assignee: document.getElementById('field_team_assignee').value,
                    due: document.getElementById('field_due').value,
                    status: document.getElementById('field_status').value,
                    description: document.getElementById('field_description').value
                };
            } else {
                bodyData = {
                    name: document.getElementById('field_name').value,
                    contact_person: document.getElementById('field_contact_person').value,
                    our_assignee: document.getElementById('field_our_assignee').value,
                    area: document.getElementById('field_area').value,
                    status: document.getElementById('field_status').value,
                    notes: document.getElementById('field_notes').value
                };
            }

            const isEdit = Boolean(itemId);
            const url = isEdit ? `${API_BASE}/api/${itemType}/${itemId}` : `${API_BASE}/api/${itemType}`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(bodyData)
                });

                if (res.ok) {
                    closeDataModal();
                    await fetchDashboardData();
                } else {
                    alert("保存に失敗しました。権限や通信状態を確認してください。");
                }
            } catch (err) {
                console.error("Save Error:", err);
                alert("送信中にエラーが発生しました。");
            }
        }

        async function deleteItem(type, id) {
            if (!confirm("本当に削除しますか？")) return;

            try {
                const res = await fetch(`${API_BASE}/api/${type}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.ok) {
                    await fetchDashboardData();
                } else {
                    alert("削除に失敗しました。権限を確認してください。");
                }
            } catch (err) {
                console.error("Delete Error:", err);
                alert("削除処理中にエラーが発生しました。");
            }
        }
    </script>
