<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海のサインプロジェクト - 管理ダッシュボード</title>

    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #0c4a6e, #075985, #0284c7, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-shape {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
            filter: blur(1px);
        }

        .crystal {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(56,189,248,0.3));
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 32px 0 rgba(0, 191, 255, 0.37);
        }

        @media (min-width: 768px) {
            .crystal {
                width: 40px;
                height: 40px;
            }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(15deg) scale(1.05); }
        }

        @keyframes floatFast {
            0%, 100% { transform: translateY(0px) rotate(45deg) scale(1); }
            50% { transform: translateY(-30px) rotate(60deg) scale(1.1); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-20deg); }
        }

        .anim-float-1 { animation: floatSlow 8s ease-in-out infinite; }
        .anim-float-2 { animation: floatFast 6s ease-in-out infinite; }
        .anim-float-3 { animation: floatReverse 10s ease-in-out infinite; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between">

    <!-- 背景オブジェクト -->
    <div class="bg-shape crystal anim-float-1" style="top: 10%; left: 3%;"></div>
    <div class="bg-shape crystal anim-float-2" style="top: 65%; left: 5%;"></div>
    <div class="bg-shape crystal anim-float-3" style="top: 18%; right: 4%;"></div>
    <div class="bg-shape crystal anim-float-1" style="bottom: 12%; right: 8%;"></div>

    <!-- HEADER -->
    <header class="glass-panel sticky top-0 z-30 shadow-md w-full">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shrink-0">
                    <i data-lucide="waves" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
                <span class="font-bold text-base sm:text-xl text-slate-800 tracking-tight flex items-center gap-1.5">
                    海のサインプロジェクト - 管理ダッシュボード
                    <span class="text-[10px] sm:text-xs text-brand-600 font-normal border border-brand-200 bg-brand-50 px-1.5 py-0.5 rounded-full">Dashboard</span>
                </span>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-4">
                <div class="flex items-center space-x-1.5 sm:space-x-2 bg-slate-100/80 px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full border border-slate-200/80 shadow-inner">
                    <img id="userAvatar" src="https://placehold.co/80x80/0284c7/ffffff?text=U" alt="Avatar" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full object-cover">
                    <div class="text-left hidden sm:block">
                        <div id="userName" class="text-xs font-semibold text-slate-700 max-w-[100px] truncate">ゲスト</div>
                    </div>
                    <span id="roleBadge" class="text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 uppercase">GUEST</span>
                </div>

                <button id="authBtn" onclick="toggleAuthAction()" class="px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 text-white text-xs font-semibold flex items-center space-x-1 transition shadow-md shrink-0">
                    <i id="authBtnIcon" data-lucide="log-in" class="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span id="authBtnText" class="text-xs">ログイン</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8 flex-1 space-y-4 sm:space-y-6 relative z-10 w-full">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-6">
            <div class="glass-panel p-4 sm:p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400 uppercase tracking-wider">認証状態</p>
                    <p id="authSource" class="text-sm sm:text-base font-bold text-slate-700 mt-1 flex items-center gap-2">
                        <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-slate-400 inline-block shrink-0"></span> 未認証
                    </p>
                </div>
                <div class="p-2.5 sm:p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="shield-check" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
            </div>

            <div class="glass-panel p-4 sm:p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400 uppercase tracking-wider">アクセス権限</p>
                    <p id="statRoleText" class="text-sm sm:text-base font-bold text-slate-700 mt-1">一般</p>
                </div>
                <div class="p-2.5 sm:p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="key-round" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
            </div>

            <div class="glass-panel p-4 sm:p-5 rounded-2xl shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs font-medium text-slate-400 uppercase tracking-wider">DB接続状況</p>
                    <p id="apiStatusText" class="text-sm sm:text-base font-bold text-slate-700 mt-1">確認中...</p>
                </div>
                <div class="p-2.5 sm:p-3 bg-brand-50 text-brand-600 rounded-xl border border-brand-100">
                    <i data-lucide="database" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl shadow-xl p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4 sm:mb-6">
                <div class="flex bg-slate-200/60 p-1 rounded-xl border border-slate-300/50 w-full sm:w-auto justify-between sm:justify-start">
                    <button id="tabTasksBtn" onclick="switchDataTab('tasks')" class="flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs font-bold bg-white text-brand-600 shadow-md transition text-center">
                        タスク管理
                    </button>
                    <button id="tabHotelsBtn" onclick="switchDataTab('hotels')" class="flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition text-center">
                        交渉・企業
                    </button>
                    <button id="tabLogsBtn" onclick="switchDataTab('logs')" class="flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition text-center">
                        操作ログ
                    </button>
                </div>

                <button id="addItemBtn" onclick="openCreateModal()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-cyan-600 hover:from-brand-700 hover:to-cyan-700 text-white text-xs font-bold flex items-center justify-center space-x-1.5 transition shadow-lg shrink-0 cursor-pointer">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span id="addItemBtnText">新規タスク追加</span>
                </button>
            </div>

            <div id="dataContainer" class="min-h-[250px] overflow-x-auto"></div>
        </div>
    </main>

    <!-- LOGIN MODAL (メール認証コード方式) -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white/95 w-[92vw] max-w-[380px] rounded-2xl p-5 sm:p-6 border border-white/50 shadow-2xl relative text-center">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-1">メール認証ログイン</h3>
            <p class="text-xs text-slate-500 mb-4">@nago-th.open.ed.jp のメールアドレスを入力してください。</p>

            <!-- Step 1: メールアドレス入力 -->
            <div id="emailStep" class="space-y-3">
                <input type="email" id="authEmailInput" placeholder="example@nago-th.open.ed.jp" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                <button id="sendCodeBtn" onclick="sendAuthCode()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-sky-500 text-white font-bold text-xs hover:from-brand-700 hover:to-sky-600 transition shadow-md flex items-center justify-center gap-1.5">
                    <span>認証コードを送信</span>
                </button>
            </div>

            <!-- Step 2: 認証コード入力 -->
            <div id="codeStep" class="space-y-3 hidden">
                <p class="text-[11px] text-emerald-600 font-semibold">認証コードを送信しました</p>
                <input type="text" id="authCodeInput" placeholder="6桁の認証コード" maxlength="6" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs text-center font-mono tracking-widest focus:ring-2 focus:ring-brand-500 focus:outline-none">
                <button id="verifyCodeBtn" onclick="verifyAuthCode()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 transition shadow-md">
                    ログイン
                </button>
                <button onclick="resetAuthStep()" class="w-full text-[11px] text-slate-400 underline mt-1">
                    メールアドレスを入力し直す
                </button>
            </div>
        </div>
    </div>

    <!-- CRUD MODAL -->
    <div id="dataModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden">
        <div class="bg-white/95 w-[92vw] max-w-[480px] rounded-2xl p-5 sm:p-6 border border-white/50 shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="closeDataModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 id="modalFormTitle" class="text-base sm:text-lg font-bold text-slate-800 mb-4 shrink-0">データ編集</h3>

            <form id="dataForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5 overflow-y-auto pr-1 flex-1">
                <input type="hidden" id="formItemType">
                <input type="hidden" id="formItemId">

                <div id="formFieldsContainer" class="space-y-3.5"></div>

                <div class="flex items-center justify-end space-x-2.5 pt-4 border-t border-slate-200 sticky bottom-0 bg-white/95">
                    <button type="button" onclick="closeDataModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-xs font-semibold hover:bg-slate-50">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-sky-600 text-white text-xs font-bold shadow-md hover:from-brand-700 hover:to-sky-700">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-slate-900/40 border-t border-white/10 py-3.5 mt-auto relative z-10 backdrop-blur-sm w-full">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-300/80">
            &copy; 海のサインプロジェクト Dashboard
        </div>
    </footer>

    <!-- JS APPLICATION LOGIC -->
    <script>
        const API_BASE = "https://uminosign.zinn1019t.workers.dev";
        const ALLOWED_DOMAIN = "nago-th.open.ed.jp";

        let currentState = {
            user: null,
            authType: 'guest',
            token: '',
            activeTab: 'tasks',
            tasks: [],
            hotels: [],
            logs: []
        };

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) lucide.createIcons();

            loadStoredSession();

            if (currentState.token) {
                await verifySessionWithServer();
            }
            await fetchDashboardData();
        });

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (currentState.token) {
                headers['X-Custom-Auth'] = currentState.token;
                headers['Authorization'] = `Bearer ${currentState.token}`;
            }
            return headers;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getStatusBadgeClass(status) {
            switch (status) {
                case '完了':
                case '合意':
                    return 'bg-emerald-100 text-emerald-700 border border-emerald-200';
                case '進行中':
                case '交渉中':
                    return 'bg-sky-100 text-sky-700 border border-sky-200';
                case '未着手':
                case 'アプローチ前':
                    return 'bg-slate-100 text-slate-600 border border-slate-200';
                case '保留':
                case '見送り':
                    return 'bg-amber-100 text-amber-700 border border-amber-200';
                default:
                    return 'bg-slate-100 text-slate-600 border border-slate-200';
            }
        }

        function openLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.classList.add('hidden');
            resetAuthStep();
        }

        function resetAuthStep() {
            document.getElementById('emailStep').classList.remove('hidden');
            document.getElementById('codeStep').classList.add('hidden');
            document.getElementById('authCodeInput').value = '';
        }

        function toggleAuthAction() {
            if (currentState.authType !== 'guest') {
                currentState.user = null;
                currentState.authType = 'guest';
                currentState.token = '';
                localStorage.removeItem('uminosign_auth');
                updateUserUI();
                fetchDashboardData();
            } else {
                openLoginModal();
            }
        }

        async function sendAuthCode() {
            const email = document.getElementById('authEmailInput').value.trim();
            const btn = document.getElementById('sendCodeBtn');

            if (!email.toLowerCase().endsWith(`@${ALLOWED_DOMAIN}`)) {
                alert(`@${ALLOWED_DOMAIN} のメールアドレスを入力してください。`);
                return;
            }

            btn.disabled = true;
            btn.innerText = "送信中...";

            try {
                const res = await fetch(`${API_BASE}/api/auth/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (res.ok) {
                    document.getElementById('emailStep').classList.add('hidden');
                    document.getElementById('codeStep').classList.remove('hidden');
                } else {
                    const data = await res.json().catch(() => ({}));
                    alert(data.error || data.message || "送信に失敗しました。");
                }
            } catch (e) {
                console.error("Send code error:", e);
                alert("通信エラーが発生しました。");
            } finally {
                btn.disabled = false;
                btn.innerText = "認証コードを送信";
            }
        }

        async function verifyAuthCode() {
            const email = document.getElementById('authEmailInput').value.trim();
            const code = document.getElementById('authCodeInput').value.trim();
            const btn = document.getElementById('verifyCodeBtn');

            if (!code || code.length !== 6) {
                alert("6桁の認証コードを入力してください。");
                return;
            }

            btn.disabled = true;
            btn.innerText = "検証中...";

            try {
                const res = await fetch(`${API_BASE}/api/auth/verify-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                if (res.ok) {
                    const data = await res.json();
                    currentState.authType = 'email';
                    currentState.token = data.token;
                    currentState.user = data.user;

                    saveSession();
                    updateUserUI();
                    closeLoginModal();
                    fetchDashboardData();
                } else {
                    const data = await res.json().catch(() => ({}));
                    alert(data.error || data.message || "コードが一致しないか期限切れです。");
                }
            } catch (e) {
                console.error("Verify code error:", e);
                alert("認証処理エラーが発生しました。");
            } finally {
                btn.disabled = false;
                btn.innerText = "ログイン";
            }
        }

        async function verifySessionWithServer() {
            if (!currentState.token) return;
            try {
                const res = await fetch(`${API_BASE}/api/auth/verify`, { headers: getAuthHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated && data.user) {
                        currentState.user = {
                            ...currentState.user,
                            role: data.user.role,
                            name: data.user.name || currentState.user?.name,
                            avatar_url: data.user.avatar_url || currentState.user?.avatar_url
                        };
                        saveSession();
                        updateUserUI();
                    }
                } else {
                    currentState.user = null;
                    currentState.authType = 'guest';
                    currentState.token = '';
                    localStorage.removeItem('uminosign_auth');
                    updateUserUI();
                }
            } catch (err) {
                console.error("Session verification failed:", err);
            }
        }

        function saveSession() {
            localStorage.setItem('uminosign_auth', JSON.stringify({
                user: currentState.user,
                authType: currentState.authType,
                token: currentState.token
            }));
        }

        function loadStoredSession() {
            const stored = localStorage.getItem('uminosign_auth');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    currentState.user = parsed.user;
                    currentState.authType = parsed.authType;
                    currentState.token = parsed.token || '';
                    updateUserUI();
                } catch (e) {
                    localStorage.removeItem('uminosign_auth');
                }
            }
        }

        function updateUserUI() {
            const userNameEl = document.getElementById('userName');
            const userAvatarEl = document.getElementById('userAvatar');
            const roleBadgeEl = document.getElementById('roleBadge');
            const authSourceEl = document.getElementById('authSource');
            const statRoleTextEl = document.getElementById('statRoleText');
            const authBtnText = document.getElementById('authBtnText');
            const authBtnIcon = document.getElementById('authBtnIcon');

            if (currentState.authType !== 'guest' && currentState.user) {
                userNameEl.innerText = currentState.user.name || 'ユーザー';
                userAvatarEl.src = currentState.user.avatar_url || 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = currentState.user.role || 'USER';

                authSourceEl.innerHTML = `<span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-500 inline-block shrink-0"></span> メール認証済`;
                statRoleTextEl.innerText = currentState.user.role === 'ADMIN' ? '管理者' : '一般';

                authBtnText.innerText = "ログアウト";
                authBtnIcon.setAttribute('data-lucide', 'log-out');
            } else {
                userNameEl.innerText = 'ゲスト';
                userAvatarEl.src = 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = 'GUEST';

                authSourceEl.innerHTML = `<span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-slate-400 inline-block shrink-0"></span> 未認証`;
                statRoleTextEl.innerText = '一般';

                authBtnText.innerText = "ログイン";
                authBtnIcon.setAttribute('data-lucide', 'log-in');
            }
            if (window.lucide) lucide.createIcons();
        }

        async function fetchDashboardData() {
            if (!currentState.token) {
                document.getElementById('apiStatusText').innerText = "要ログイン";
                currentState.tasks = [];
                currentState.hotels = [];
                currentState.logs = [];
                renderDashboardData();
                return;
            }

            try {
                const [tasksRes, hotelsRes, logsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/tasks`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/hotels`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/logs`, { headers: getAuthHeaders() })
                ]);

                if (tasksRes.ok) currentState.tasks = await tasksRes.json();
                if (hotelsRes.ok) currentState.hotels = await hotelsRes.json();
                if (logsRes.ok) currentState.logs = await logsRes.json();

                if (tasksRes.status === 401 || hotelsRes.status === 401) {
                    document.getElementById('apiStatusText').innerText = "再ログインが必要";
                } else {
                    document.getElementById('apiStatusText').innerText = "D1 接続中";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('apiStatusText').innerText = "通信エラー";
            }
            renderDashboardData();
        }

        function switchDataTab(tab) {
            currentState.activeTab = tab;
            const btnTasks = document.getElementById('tabTasksBtn');
            const btnHotels = document.getElementById('tabHotelsBtn');
            const btnLogs = document.getElementById('tabLogsBtn');
            const addBtn = document.getElementById('addItemBtn');
            const addBtnText = document.getElementById('addItemBtnText');

            const activeClass = "flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs font-bold bg-white text-brand-600 shadow-md transition text-center cursor-pointer";
            const inactiveClass = "flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition text-center cursor-pointer";

            btnTasks.className = tab === 'tasks' ? activeClass : inactiveClass;
            btnHotels.className = tab === 'hotels' ? activeClass : inactiveClass;
            btnLogs.className = tab === 'logs' ? activeClass : inactiveClass;

            if (tab === 'tasks') {
                addBtn.style.display = 'flex';
                addBtnText.innerText = '新規タスク追加';
            } else if (tab === 'hotels') {
                addBtn.style.display = 'flex';
                addBtnText.innerText = '新規企業追加';
            } else {
                addBtn.style.display = 'none';
            }

            renderDashboardData();
        }

        function renderDashboardData() {
            const container = document.getElementById('dataContainer');
            const tab = currentState.activeTab;

            if (tab === 'tasks') renderTasksView(container);
            else if (tab === 'hotels') renderHotelsView(container);
            else if (tab === 'logs') renderLogsView(container);

            if (window.lucide) lucide.createIcons();
        }

        function renderTasksView(container) {
            if (!currentState.tasks || currentState.tasks.length === 0) {
                container.innerHTML = `<p class="text-center py-10 text-xs sm:text-sm text-slate-400">表示できるタスクはありません（ログインが必要です）</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left text-xs whitespace-nowrap min-w-[600px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 uppercase font-semibold">
                            <th class="py-3 px-3">タスク名</th>
                            <th class="py-3 px-3">担当者</th>
                            <th class="py-3 px-3">詳細・メモ</th>
                            <th class="py-3 px-3">期限</th>
                            <th class="py-3 px-3">ステータス</th>
                            <th class="py-3 px-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700">
                        ${currentState.tasks.map(t => `
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="py-3 px-3 font-bold text-slate-900">${escapeHtml(t.title)}</td>
                                <td class="py-3 px-3 text-slate-600 font-medium">${escapeHtml(t.team_assignee || t.assignee || t.team || '-')}</td>
                                <td class="py-3 px-3 text-slate-500 max-w-[150px] truncate">${escapeHtml(t.description || t.detail || '-')}</td>
                                <td class="py-3 px-3 text-slate-500 font-mono">${escapeHtml(t.due || '-')}</td>
                                <td class="py-3 px-3">
                                    <span class="px-2 py-1 rounded-full text-[10px] font-bold ${getStatusBadgeClass(t.status)}">${escapeHtml(t.status || '未着手')}</span>
                                </td>
                                <td class="py-3 px-3 text-right space-x-1">
                                    <button onclick="openEditModal('tasks', '${t.id}')" class="p-1 text-slate-400 hover:text-brand-600 transition"><i data-lucide="edit-3" class="w-4 h-4 inline"></i></button>
                                    <button onclick="deleteItem('tasks', '${t.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderHotelsView(container) {
            if (!currentState.hotels || currentState.hotels.length === 0) {
                container.innerHTML = `<p class="text-center py-10 text-xs sm:text-sm text-slate-400">表示できる企業データはありません（ログインが必要です）</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left text-xs whitespace-nowrap min-w-[600px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 uppercase font-semibold">
                            <th class="py-3 px-3">企業・施設名</th>
                            <th class="py-3 px-3">担当者</th>
                            <th class="py-3 px-3">進捗・メモ</th>
                            <th class="py-3 px-3">ステータス</th>
                            <th class="py-3 px-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700">
                        ${currentState.hotels.map(h => `
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="py-3 px-3 font-bold text-slate-900">${escapeHtml(h.name)}</td>
                                <td class="py-3 px-3 text-slate-600 font-medium">${escapeHtml(h.contact_person || h.assignee || '-')}</td>
                                <td class="py-3 px-3 text-slate-500 max-w-[200px] truncate">${escapeHtml(h.memo || h.description || h.notes || h.detail || '-')}</td>
                                <td class="py-3 px-3">
                                    <span class="px-2 py-1 rounded-full text-[10px] font-bold ${getStatusBadgeClass(h.status)}">${escapeHtml(h.status || 'アプローチ前')}</span>
                                </td>
                                <td class="py-3 px-3 text-right space-x-1">
                                    <button onclick="openEditModal('hotels', '${h.id}')" class="p-1 text-slate-400 hover:text-brand-600 transition"><i data-lucide="edit-3" class="w-4 h-4 inline"></i></button>
                                    <button onclick="deleteItem('hotels', '${h.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderLogsView(container) {
            if (!currentState.logs || currentState.logs.length === 0) {
                container.innerHTML = `<p class="text-center py-10 text-xs sm:text-sm text-slate-400">操作ログはありません</p>`;
                return;
            }

            container.innerHTML = `
                <table class="w-full text-left text-xs whitespace-nowrap min-w-[500px]">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-400 uppercase font-semibold">
                            <th class="py-3 px-3">日時</th>
                            <th class="py-3 px-3">ユーザー名</th>
                            <th class="py-3 px-3">ログイン/操作種別</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700">
                        ${currentState.logs.map(l => `
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="py-3 px-3 text-slate-400 font-mono">${escapeHtml(l.logged_at || l.created_at || l.timestamp || '-')}</td>
                                <td class="py-3 px-3 font-semibold text-slate-800">${escapeHtml(l.user_name || '-')}</td>
                                <td class="py-3 px-3 text-slate-600">${escapeHtml(l.login_type || l.action || '-')}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function openCreateModal() {
            if (!currentState.token) {
                alert("タスクを追加するにはログインが必要です。");
                openLoginModal();
                return;
            }

            const type = currentState.activeTab;
            if (type === 'logs') return;

            const modal = document.getElementById('dataModal');
            if (!modal) return;

            document.getElementById('modalFormTitle').innerText = type === 'tasks' ? '新規タスク登録' : '新規企業登録';
            document.getElementById('formItemType').value = type;
            document.getElementById('formItemId').value = '';

            buildFormFields(type, null);
            modal.classList.remove('hidden');
        }

        function openEditModal(type, id) {
            const modal = document.getElementById('dataModal');
            if (!modal) return;

            const list = type === 'tasks' ? currentState.tasks : currentState.hotels;
            const item = list.find(x => String(x.id) === String(id));
            if (!item) return;

            document.getElementById('modalFormTitle').innerText = type === 'tasks' ? 'タスク編集' : '企業情報編集';
            document.getElementById('formItemType').value = type;
            document.getElementById('formItemId').value = id;

            buildFormFields(type, item);
            modal.classList.remove('hidden');
        }

        function closeDataModal() {
            const modal = document.getElementById('dataModal');
            if (modal) modal.classList.add('hidden');
        }

        function buildFormFields(type, item) {
            const container = document.getElementById('formFieldsContainer');
            if (!container) return;

            if (type === 'tasks') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">タスク名</label>
                        <input type="text" id="field_title" value="${escapeHtml(item?.title || '')}" required class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">担当者</label>
                        <input type="text" id="field_assignee" value="${escapeHtml(item?.team_assignee || item?.assignee || '')}" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">期限</label>
                        <input type="date" id="field_due" value="${escapeHtml(item?.due || '')}" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ステータス</label>
                        <select id="field_status" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="未着手" ${item?.status === '未着手' ? 'selected' : ''}>未着手</option>
                            <option value="進行中" ${item?.status === '進行中' ? 'selected' : ''}>進行中</option>
                            <option value="完了" ${item?.status === '完了' ? 'selected' : ''}>完了</option>
                            <option value="保留" ${item?.status === '保留' ? 'selected' : ''}>保留</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">詳細・メモ</label>
                        <textarea id="field_description" rows="3" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">${escapeHtml(item?.description || item?.detail || '')}</textarea>
                    </div>
                `;
            } else if (type === 'hotels') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">企業・施設名</label>
                        <input type="text" id="field_name" value="${escapeHtml(item?.name || '')}" required class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">担当者</label>
                        <input type="text" id="field_contact" value="${escapeHtml(item?.contact_person || item?.assignee || '')}" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ステータス</label>
                        <select id="field_status" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="アプローチ前" ${item?.status === 'アプローチ前' ? 'selected' : ''}>アプローチ前</option>
                            <option value="交渉中" ${item?.status === '交渉中' ? 'selected' : ''}>交渉中</option>
                            <option value="合意" ${item?.status === '合意' ? 'selected' : ''}>合意</option>
                            <option value="見送り" ${item?.status === '見送り' ? 'selected' : ''}>見送り</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">進捗・メモ</label>
                        <textarea id="field_notes" rows="3" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">${escapeHtml(item?.memo || item?.description || item?.notes || item?.detail || '')}</textarea>
                    </div>
                `;
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('formItemType').value;
            const id = document.getElementById('formItemId').value;
            const isEdit = Boolean(id);

            let payload = {};
            if (type === 'tasks') {
                payload = {
                    title: document.getElementById('field_title').value,
                    team_assignee: document.getElementById('field_assignee').value,
                    due: document.getElementById('field_due').value,
                    status: document.getElementById('field_status').value,
                    description: document.getElementById('field_description').value
                };
            } else if (type === 'hotels') {
                const noteVal = document.getElementById('field_notes').value;
                payload = {
                    name: document.getElementById('field_name').value,
                    contact_person: document.getElementById('field_contact').value,
                    status: document.getElementById('field_status').value,
                    memo: noteVal,
                    description: noteVal,
                    notes: noteVal
                };
            }

            const url = isEdit ? `${API_BASE}/api/${type}/${id}` : `${API_BASE}/api/${type}`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeDataModal();
                    await fetchDashboardData();
                } else {
                    alert("保存に失敗しました。");
                }
            } catch (err) {
                console.error("Save error:", err);
                alert("通信エラーが発生しました。");
            }
        }

        async function deleteItem(type, id) {
            if (!confirm("本当に削除しますか？")) return;

            try {
                const res = await fetch(`${API_BASE}/api/${type}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.ok) {
                    await fetchDashboardData();
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (err) {
                console.error("Delete error:", err);
                alert("通信エラーが発生しました。");
            }
        }
    </script>
</body>
</html>
