<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海のサインプロジェクト-タスク・交渉先管理ダッシュボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- ナビゲーションバー -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                    Dashboard App
                </span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openBindModal()" class="px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
                    アカウント連携
                </button>
                <button onclick="openLoginModal()" class="px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition">
                    ログイン / 登録
                </button>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- タブ切り替え -->
        <div class="flex space-x-2 border-b border-slate-200 mb-6">
            <button id="tabBtn-tasks" onclick="switchTab('tasks')" class="pb-3 px-4 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600">
                タスク一覧
            </button>
            <button id="tabBtn-hotels" onclick="switchTab('hotels')" class="pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700">
                ホテル一覧
            </button>
        </div>

        <!-- アクションエリア -->
        <div class="flex justify-between items-center mb-6">
            <h1 id="pageTitle" class="text-xl font-bold text-slate-800">タスク管理</h1>
            <button onclick="openCreateModal()" class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition">
                + 新規作成
            </button>
        </div>

        <!-- データ一覧（カード形式） -->
        <div id="dataListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JavaScriptで動的生成 -->
        </div>
    </main>

    <!-- 1. ログイン / 新規登録モーダル -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800" id="authModalTitle">認証</h2>
                <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <!-- Auth タッチ切り替え -->
            <div class="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-xl mb-4">
                <button id="authTabLogin" onclick="switchAuthTab('login')" class="py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800">ログイン</button>
                <button id="authTabRegister" onclick="switchAuthTab('register')" class="py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800">新規登録</button>
            </div>
            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">メールアドレス</label>
                    <input type="email" id="authEmail" required class="w-full p-2.5 rounded-xl glass-input text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">パスワード</label>
                    <input type="password" id="authPassword" required class="w-full p-2.5 rounded-xl glass-input text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition shadow-sm">
                    実行
                </button>
            </form>
        </div>
    </div>

    <!-- 2. アカウント連携モーダル -->
    <div id="bindModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800">アカウント連携</h2>
                <button onclick="closeBindModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <p class="text-xs text-slate-500 mb-4">外部サービスアカウントを現在のアカウントに統合・連携します。</p>
            <div class="space-y-3">
                <button class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-xl flex items-center justify-center space-x-2 transition">
                    <span>Googleで連携</span>
                </button>
                <button class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs rounded-xl flex items-center justify-center space-x-2 transition">
                    <span>GitHubで連携</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. CRUD データ入力/編集モーダル -->
    <div id="dataModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-800" id="modalFormTitle">データ入力</h2>
                <button onclick="closeDataModal()" class="text-slate-400 hover:text-slate-600">&times;</button>
            </div>
            <form id="crudForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="formItemId">
                <input type="hidden" id="formItemType">
                <div id="formFieldsContainer" class="space-y-3">
                    <!-- Dynamic form inputs -->
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeDataModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition shadow-sm">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        const API_BASE = "http://localhost:3000"; // 必要に応じてバックエンドURLを変更してください

        // アプリケーション状態
        let currentState = {
            activeTab: 'tasks', // 'tasks' | 'hotels'
            authMode: 'login',  // 'login' | 'register'
            authHeaderToken: localStorage.getItem('token') || ''
        };

        // --- 初期化 ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchDashboardData();
        });

        // --- メインタブ切り替え ---
        function switchTab(type) {
            currentState.activeTab = type;
            const tasksBtn = document.getElementById('tabBtn-tasks');
            const hotelsBtn = document.getElementById('tabBtn-hotels');
            const pageTitle = document.getElementById('pageTitle');

            if (type === 'tasks') {
                tasksBtn.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600";
                hotelsBtn.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700";
                pageTitle.innerText = "タスク管理";
            } else {
                hotelsBtn.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600";
                tasksBtn.className = "pb-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700";
                pageTitle.innerText = "ホテル管理";
            }
            fetchDashboardData();
        }

        // --- データ取得＆レンダリング ---
        async function fetchDashboardData() {
            const container = document.getElementById('dataListContainer');
            container.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-400">読み込み中...</div>`;

            try {
                const endpoint = currentState.activeTab === 'tasks' ? '/api/tasks' : '/api/hotels';
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    headers: { 'Authorization': `Bearer ${currentState.authHeaderToken}` }
                });

                if (!res.ok) throw new Error('データの取得に失敗しました');
                const data = await res.json();
                renderCards(data);
            } catch (err) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-rose-500">${escapeHtml(err.message)}</div>`;
            }
        }

        function renderCards(items) {
            const container = document.getElementById('dataListContainer');
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-400">データが登録されていません</div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                if (currentState.activeTab === 'tasks') {
                    return `
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-slate-800 text-sm">${escapeHtml(item.title)}</h3>
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-indigo-50 text-indigo-600">${escapeHtml(item.status)}</span>
                            </div>
                            <p class="text-xs text-slate-500 mb-1">担当: ${escapeHtml(item.team)}</p>
                            <p class="text-xs text-slate-400 mb-4">期限: ${escapeHtml(item.due)}</p>
                            <div class="flex justify-end space-x-2 border-t border-slate-50 pt-3">
                                <button onclick="openEditModal('tasks', '${item.id}', '${escapeHtml(item.title)}', '${escapeHtml(item.team)}', '${escapeHtml(item.due)}', '${escapeHtml(item.status)}')" class="text-xs text-indigo-600 hover:underline">編集</button>
                                <button onclick="deleteItem('tasks', '${item.id}')" class="text-xs text-rose-500 hover:underline">削除</button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md transition">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-slate-800 text-sm">${escapeHtml(item.name)}</h3>
                                <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-emerald-50 text-emerald-600">${escapeHtml(item.status)}</span>
                            </div>
                            <p class="text-xs text-slate-500 mb-4">エリア: ${escapeHtml(item.location)}</p>
                            <div class="flex justify-end space-x-2 border-t border-slate-50 pt-3">
                                <button onclick="openEditModal('hotels', '${item.id}', '${escapeHtml(item.name)}', '${escapeHtml(item.location)}', '${escapeHtml(item.status)}')" class="text-xs text-indigo-600 hover:underline">編集</button>
                                <button onclick="deleteItem('hotels', '${item.id}')" class="text-xs text-rose-500 hover:underline">削除</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        // --- 認証機能 ---
        function switchAuthTab(mode) {
            currentState.authMode = mode;
            const loginBtn = document.getElementById('authTabLogin');
            const regBtn = document.getElementById('authTabRegister');

            if (mode === 'login') {
                loginBtn.className = "py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800";
                regBtn.className = "py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800";
            } else {
                regBtn.className = "py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800";
                loginBtn.className = "py-2 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-800";
            }
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const endpoint = currentState.authMode === 'login' ? '/api/auth/login' : '/api/auth/register';

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) throw new Error('認証処理に失敗しました');
                const data = await res.json();
                
                if (data.token) {
                    currentState.authHeaderToken = data.token;
                    localStorage.setItem('token', data.token);
                }

                alert(currentState.authMode === 'login' ? 'ログインしました' : '登録が完了しました');
                closeLoginModal();
                fetchDashboardData();
            } catch (err) {
                alert("エラー: " + err.message);
            }
        }

        // --- モーダル表示制御 ---
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function openBindModal() {
            document.getElementById('bindModal').classList.remove('hidden');
        }

        function closeBindModal() {
            document.getElementById('bindModal').classList.add('hidden');
        }

        function openDataModal() {
            document.getElementById('dataModal').classList.remove('hidden');
        }

        function closeDataModal() {
            document.getElementById('dataModal').classList.add('hidden');
        }

        // --- CRUDモーダルフォーム生成＆ハンドリング ---
        function openCreateModal() {
            const type = currentState.activeTab;
            if (type !== 'tasks' && type !== 'hotels') return;

            document.getElementById('modalFormTitle').innerText = type === 'tasks' ? '新規タスク追加' : '新規ホテル追加';
            document.getElementById('formItemType').value = type;
            document.getElementById('formItemId').value = '';

            const container = document.getElementById('formFieldsContainer');
            if (type === 'tasks') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">タスク名</label>
                        <input type="text" id="inputTitle" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">担当チーム</label>
                        <input type="text" id="inputTeam" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">期限</label>
                        <input type="date" id="inputDue" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ステータス</label>
                        <select id="inputStatus" class="w-full p-2.5 rounded-xl glass-input text-xs">
                            <option value="未着手">未着手</option>
                            <option value="進行中">進行中</option>
                            <option value="完了">完了</option>
                        </select>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">施設名</label>
                        <input type="text" id="inputName" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">エリア</label>
                        <input type="text" id="inputLocation" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ステータス</label>
                        <select id="inputStatus" class="w-full p-2.5 rounded-xl glass-input text-xs">
                            <option value="検討中">検討中</option>
                            <option value="交渉中">交渉中</option>
                            <option value="契約締結">契約締結</option>
                        </select>
                    </div>
                `;
            }
            openDataModal();
        }

        function openEditModal(type, id, val1, val2, val3, val4) {
            document.getElementById('modalFormTitle').innerText = type === 'tasks' ? 'タスク編集' : 'ホテル編集';
            document.getElementById('formItemType').value = type;
            document.getElementById('formItemId').value = id;

            const container = document.getElementById('formFieldsContainer');
            if (type === 'tasks') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">タスク名</label>
                        <input type="text" id="inputTitle" value="${val1}" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">担当チーム</label>
                        <input type="text" id="inputTeam" value="${val2}" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">期限</label>
                        <input type="date" id="inputDue" value="${val3}" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ステータス</label>
                        <select id="inputStatus" class="w-full p-2.5 rounded-xl glass-input text-xs">
                            <option value="未着手" ${val4 === '未着手' ? 'selected' : ''}>未着手</option>
                            <option value="進行中" ${val4 === '進行中' ? 'selected' : ''}>進行中</option>
                            <option value="完了" ${val4 === '完了' ? 'selected' : ''}>完了</option>
                        </select>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">施設名</label>
                        <input type="text" id="inputName" value="${val1}" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">エリア</label>
                        <input type="text" id="inputLocation" value="${val2}" required class="w-full p-2.5 rounded-xl glass-input text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ステータス</label>
                        <select id="inputStatus" class="w-full p-2.5 rounded-xl glass-input text-xs">
                            <option value="検討中" ${val3 === '検討中' ? 'selected' : ''}>検討中</option>
                            <option value="交渉中" ${val3 === '交渉中' ? 'selected' : ''}>交渉中</option>
                            <option value="契約締結" ${val3 === '契約締結' ? 'selected' : ''}>契約締結</option>
                        </select>
                    </div>
                `;
            }
            openDataModal();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const type = document.getElementById('formItemType').value;
            const id = document.getElementById('formItemId').value;
            const isEdit = Boolean(id);

            let payload = {};
            if (type === 'tasks') {
                payload = {
                    title: document.getElementById('inputTitle').value,
                    team: document.getElementById('inputTeam').value,
                    due: document.getElementById('inputDue').value,
                    status: document.getElementById('inputStatus').value
                };
            } else {
                payload = {
                    name: document.getElementById('inputName').value,
                    location: document.getElementById('inputLocation').value,
                    status: document.getElementById('inputStatus').value
                };
            }

            const url = isEdit ? `${API_BASE}/api/${type}/${id}` : `${API_BASE}/api/${type}`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentState.authHeaderToken}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('保存処理に失敗しました');
                closeDataModal();
                fetchDashboardData();
            } catch (err) {
                alert("エラー: " + err.message);
            }
        }

        async function deleteItem(type, id) {
            if (!confirm('本当に削除しますか？')) return;

            try {
                const res = await fetch(`${API_BASE}/api/${type}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${currentState.authHeaderToken}` }
                });

                if (!res.ok) throw new Error('削除処理に失敗しました');
                fetchDashboardData();
            } catch (err) {
                alert("エラー: " + err.message);
            }
        }

        // --- ユーティリティ ---
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
