<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海のサインプロジェクト - 管理ダッシュボード</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- 🌐 HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3 shrink-0">
                <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="waves" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-base sm:text-lg text-slate-800 tracking-tight leading-tight truncate">
                    海のサイン<span class="hidden sm:inline">プロジェクト</span>
                </span>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                <div class="flex items-center space-x-2 bg-slate-100 px-2.5 py-1.5 rounded-full border border-slate-200">
                    <img id="userAvatar" src="https://placehold.co/80x80/0284c7/ffffff?text=U" alt="Avatar" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full object-cover">
                    <div class="text-left">
                        <div id="userName" class="text-xs font-semibold text-slate-700 max-w-[80px] sm:max-w-[120px] truncate">ゲスト</div>
                    </div>
                    <span id="roleBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 uppercase">GUEST</span>
                </div>

                <button id="authBtn" onclick="toggleAuthAction()" class="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium flex items-center space-x-1.5 transition shadow-sm">
                    <i id="authBtnIcon" data-lucide="log-in" class="w-3.5 h-3.5"></i>
                    <span id="authBtnText" class="hidden sm:inline">ログイン</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 📊 MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

        <!-- Status Overview Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">認証ステータス</p>
                    <p id="authSource" class="text-xs sm:text-sm font-semibold text-slate-600 mt-0.5 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-slate-400 inline-block"></span> 未認証
                    </p>
                </div>
                <div class="p-2.5 bg-slate-50 text-slate-500 rounded-lg border border-slate-100">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">アクセス権限</p>
                    <p id="statRoleText" class="text-xs sm:text-sm font-semibold text-slate-700 mt-0.5">一般ユーザー</p>
                </div>
                <div class="p-2.5 bg-slate-50 text-slate-500 rounded-lg border border-slate-100">
                    <i data-lucide="key-round" class="w-5 h-5"></i>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">DB 接続状態</p>
                    <p id="apiStatusText" class="text-xs sm:text-sm font-semibold text-slate-700 mt-0.5">接続確認中...</p>
                </div>
                <div class="p-2.5 bg-slate-50 text-slate-500 rounded-lg border border-slate-100">
                    <i data-lucide="database" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <!-- Controls & Data Section -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <!-- Navigation Tabs -->
                <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 self-start sm:self-auto">
                    <button id="tabTasksBtn" onclick="switchDataTab('tasks')" class="px-3 sm:px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-brand-600 shadow-sm transition">
                        タスク管理
                    </button>
                    <button id="tabHotelsBtn" onclick="switchDataTab('hotels')" class="px-3 sm:px-4 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition">
                        ホテル・企業一覧
                    </button>
                    <button id="tabLogsBtn" onclick="switchDataTab('logs')" class="px-3 sm:px-4 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition">
                        操作ログ
                    </button>
                </div>

                <!-- Add Button -->
                <button id="addItemBtn" onclick="openCreateModal()" class="w-full sm:w-auto px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold flex items-center justify-center space-x-1.5 transition shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span id="addItemBtnText">新規タスク追加</span>
                </button>
            </div>

            <!-- DATA CONTAINER -->
            <div id="dataContainer"></div>
        </div>
    </main>

    <!-- 🔐 LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 border border-slate-200 shadow-xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 class="text-base font-bold text-slate-800 mb-1">システムログイン</h3>
            <p class="text-xs text-slate-500 mb-5">ご利用のアカウントを選択してください。</p>

            <div class="space-y-3">
                <!-- Google Login Button -->
                <div class="flex justify-center w-full">
                    <div id="g_id_onload"
                         data-client_id="988378587809-g9calu17mv9huuidppdjj74ibimuo7vb.apps.googleusercontent.com"
                         data-callback="handleGoogleCallback"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin w-full flex justify-center"
                         data-type="standard"
                         data-size="large"
                         data-theme="outline"
                         data-text="sign_in_with"
                         data-shape="rectangular"
                         data-logo_alignment="left">
                    </div>
                </div>

                <!-- LINE Login Button -->
                <button onclick="loginWithLine()" class="w-full py-2.5 rounded-lg bg-[#06C755] hover:bg-[#05b34c] text-white font-bold text-xs flex items-center justify-center space-x-2 transition shadow-sm">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>LINEでログイン</span>
                </button>

                <div class="pt-2 border-t border-slate-100">
                    <p class="text-[11px] text-slate-500 mb-2">管理者用パスコード</p>
                    <div class="flex gap-2">
                        <input type="password" id="adminPasscodeInput" placeholder="パスコード" class="flex-1 p-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        <button onclick="loginWithAdminPasscode()" class="px-3 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg hover:bg-slate-900 transition">
                            認証
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 📝 CRUD MODAL -->
    <div id="dataModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-md rounded-xl p-6 border border-slate-200 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeDataModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h3 id="modalFormTitle" class="text-base font-bold text-slate-800 mb-4">データ編集</h3>

            <form id="dataForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="formItemType">
                <input type="hidden" id="formItemId">

                <div id="formFieldsContainer" class="space-y-3"></div>

                <div class="flex items-center justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeDataModal()" class="px-3 py-2 rounded-lg border border-slate-300 text-slate-600 text-xs hover:bg-slate-50">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shadow-sm">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; 海のサインプロジェクト Dashboard System
        </div>
    </footer>

    <!-- 📜 JS APPLICATION LOGIC -->
    <script>
        const API_BASE = "https://uminosign.zinn1019t.workers.dev";
        const LIFF_ID = "2011830749-oBGQ72bz";

        let currentState = {
            user: null,
            authType: 'guest',
            token: '',
            activeTab: 'tasks',
            tasks: [],
            hotels: [],
            logs: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initLiff();
            loadStoredSession();
            fetchDashboardData();
        });

        function getAuthHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (currentState.token) {
                headers['X-Custom-Auth'] = currentState.token;
                headers['Authorization'] = `Bearer ${currentState.token}`;
            }
            return headers;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function initLiff() {
            if (typeof liff !== 'undefined' && LIFF_ID) {
                liff.init({ liffId: LIFF_ID }).catch(err => console.error("LIFF Init failed:", err));
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function toggleAuthAction() {
            if (currentState.authType !== 'guest') {
                // ログアウト処理
                currentState.user = null;
                currentState.authType = 'guest';
                currentState.token = '';
                localStorage.removeItem('uminosign_auth');
                updateUserUI();
                fetchDashboardData();
            } else {
                openLoginModal();
            }
        }

        /* 🔐 認証関連処理 */
        function handleGoogleCallback(response) {
            try {
                // JWTデコード（簡易パース）
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                const payload = JSON.parse(jsonPayload);

                currentState.user = {
                    name: payload.name || payload.email,
                    picture: payload.picture,
                    role: 'GENERAL'
                };
                currentState.authType = 'google';
                currentState.token = response.credential;

                saveSession();
                updateUserUI();
                closeLoginModal();
                fetchDashboardData();
            } catch (e) {
                console.error("Google Auth Decode Error:", e);
                alert("Googleログインに失敗しました。");
            }
        }

        function loginWithLine() {
            if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    currentState.user = {
                        name: profile.displayName,
                        picture: profile.pictureUrl,
                        role: 'GENERAL'
                    };
                    currentState.authType = 'line';
                    currentState.token = liff.getAccessToken();
                    saveSession();
                    updateUserUI();
                    closeLoginModal();
                    fetchDashboardData();
                }).catch(err => console.error("LINE Profile error:", err));
            } else if (typeof liff !== 'undefined') {
                liff.login();
            } else {
                alert("LIFF SDKが読み込まれていません。");
            }
        }

        function loginWithAdminPasscode() {
            const passcode = document.getElementById('adminPasscodeInput').value;
            if (!passcode) return;

            currentState.user = {
                name: '管理者',
                picture: 'https://placehold.co/80x80/0f172a/ffffff?text=A',
                role: 'ADMIN'
            };
            currentState.authType = 'admin';
            currentState.token = passcode;

            saveSession();
            updateUserUI();
            closeLoginModal();
            fetchDashboardData();
            document.getElementById('adminPasscodeInput').value = '';
        }

        function saveSession() {
            localStorage.setItem('uminosign_auth', JSON.stringify({
                user: currentState.user,
                authType: currentState.authType,
                token: currentState.token
            }));
        }

        function loadStoredSession() {
            const stored = localStorage.getItem('uminosign_auth');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    currentState.user = parsed.user;
                    currentState.authType = parsed.authType;
                    currentState.token = parsed.token || '';
                    updateUserUI();
                } catch (e) {
                    localStorage.removeItem('uminosign_auth');
                }
            }
        }

        function updateUserUI() {
            const userNameEl = document.getElementById('userName');
            const userAvatarEl = document.getElementById('userAvatar');
            const roleBadgeEl = document.getElementById('roleBadge');
            const authSourceEl = document.getElementById('authSource');
            const statRoleTextEl = document.getElementById('statRoleText');
            const authBtnText = document.getElementById('authBtnText');
            const authBtnIcon = document.getElementById('authBtnIcon');

            if (currentState.authType !== 'guest' && currentState.user) {
                userNameEl.innerText = currentState.user.name || 'ユーザー';
                userAvatarEl.src = currentState.user.picture || 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = currentState.user.role || 'USER';

                const authLabel = currentState.authType === 'google' ? 'Google' : currentState.authType === 'line' ? 'LINE' : '管理者パスコード';
                authSourceEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> ${authLabel} 認証済`;
                statRoleTextEl.innerText = currentState.user.role === 'ADMIN' ? 'システム管理者' : '一般ユーザー';

                authBtnText.innerText = "ログアウト";
                authBtnIcon.setAttribute('data-lucide', 'log-out');
            } else {
                userNameEl.innerText = 'ゲスト';
                userAvatarEl.src = 'https://placehold.co/80x80/0284c7/ffffff?text=U';
                roleBadgeEl.innerText = 'GUEST';

                authSourceEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400 inline-block"></span> 未認証`;
                statRoleTextEl.innerText = '一般ユーザー';

                authBtnText.innerText = "ログイン";
                authBtnIcon.setAttribute('data-lucide', 'log-in');
            }
            lucide.createIcons();
        }

        async function fetchDashboardData() {
            try {
                const [tasksRes, hotelsRes, logsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/tasks`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/hotels`, { headers: getAuthHeaders() }),
                    fetch(`${API_BASE}/api/logs`, { headers: getAuthHeaders() })
                ]);

                if (tasksRes.ok) currentState.tasks = await tasksRes.json();
                if (hotelsRes.ok) currentState.hotels = await hotelsRes.json();
                if (logsRes.ok) currentState.logs = await logsRes.json();

                document.getElementById('apiStatusText').innerText = "Cloudflare D1 接続中";
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('apiStatusText').innerText = "通信エラー";
            }
            renderDashboardData();
        }

        function renderDashboardData() {
            const container = document.getElementById('dataContainer');
            const tab = currentState.activeTab;

            if (tab === 'tasks') renderTasksView(container);
            else if (tab === 'hotels') renderHotelsView(container);
            else if (tab === 'logs') renderLogsView(container);
            
            lucide.createIcons();
        }

        function renderTasksView(container) {
            if (!currentState.tasks || currentState.tasks.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-xs text-slate-400">タスクはありません</p>`;
                return;
            }

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 uppercase font-semibold">
                                <th class="py-3 px-3">タスク名</th>
                                <th class="py-3 px-3">チーム内担当者</th>
                                <th class="py-3 px-3">詳細・メモ</th>
                                <th class="py-3 px-3">期限</th>
                                <th class="py-3 px-3">ステータス</th>
                                <th class="py-3 px-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-slate-700">
                            ${currentState.tasks.map(t => `
                                <tr class="hover:bg-slate-50">
                                    <td class="py-3 px-3 font-medium text-slate-900">${escapeHtml(t.title)}</td>
                                    <td class="py-3 px-3 text-slate-600 font-medium">${escapeHtml(t.team_assignee || t.assignee || t.team || '-')}</td>
                                    <td class="py-3 px-3 text-slate-500 max-w-xs truncate">${escapeHtml(t.description || t.detail || '-')}</td>
                                    <td class="py-3 px-3 text-slate-500 font-mono">${escapeHtml(t.due)}</td>
                                    <td class="py-3 px-3">
                                        <span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold ${getStatusBadgeClass(t.status)}">
                                            ${escapeHtml(t.status)}
                                        </span>
                                    </td>
                                    <td class="py-3 px-3 text-right space-x-2">
                                        <button onclick="openEditTaskModal('${t.id}')" class="text-slate-400 hover:text-brand-600">
                                            <i data-lucide="edit-3" class="w-4 h-4 inline"></i>
                                        </button>
                                        <button onclick="deleteItem('tasks', '${t.id}')" class="text-slate-400 hover:text-rose-600">
                                            <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderHotelsView(container) {
            if (!currentState.hotels || currentState.hotels.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-xs text-slate-400">ホテル・企業データはありません</p>`;
                return;
            }

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-400 uppercase font-semibold">
                                <th class="py-3 px-3">施設・企業名</th>
                                <th class="py-3 px-3">相手先担当者名</th>
                                <th class="py-3 px-3">チーム内担当者</th>
                                <th class="py-3 px-3">エリア / 所在地</th>
                                <th class="py-3 px-3">詳細・メモ</th>
                                <th class="py-3 px-3">ステータス</th>
                                <th class="py-3 px-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-slate-700">
                            ${currentState.hotels.map(h => `
                                <tr class="hover:bg-slate-50">
                                    <td class="py-3 px-3 font-medium text-slate-900">${escapeHtml(h.name)}</td>
                                    <td class="py-3 px-3 text-slate-600 font-medium">${escapeHtml(h.contact_person || h.client_assignee || '-')}</td>
                                    <td class="py-3 px-3 text-slate-600 font-medium">${escapeHtml(h.team_assignee || h.assignee || '-')}</td>
                                    <td class="py-3 px-3 text-slate-500">${escapeHtml(h.location)}</td>
                                    <td class="py-3 px-3 text-slate-500 max-w-xs truncate">${escapeHtml(h.description || h.detail || '-')}</td>
                                    <td class="py-3 px-3">
                                        <span class="inline-block px-2 py-0.5 rounded text-[11px] font-semibold ${getStatusBadgeClass(h.status)}">
                                            ${escapeHtml(h.status)}
                                        </span>
                                    </td>
                                    <td class="py-3 px-3 text-right space-x-2">
                                        <button onclick="openEditHotelModal('${h.id}')" class="text-slate-400 hover:text-brand-600">
                                            <i data-lucide="edit-3" class="w-4 h-4 inline"></i>
                                        </button>
                                        <button onclick="deleteItem('hotels', '${h.id}')" class="text-slate-400 hover:text-rose-600">
                                            <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderLogsView(container) {
            if (!currentState.logs || currentState.logs.length === 0) {
                container.innerHTML = `<p class="text-center py-8 text-xs text-slate-400">操作ログはありません</p>`;
                return;
            }

            container.innerHTML = `
                <div class="space-y-2">
                    ${currentState.logs.map(l => `
                        <div class="p-2.5 rounded bg-slate-50 border border-slate-100 flex items-center justify-between text-xs text-slate-600">

                            <div>${escapeHtml(l.login_type || l.action)}</div>

                    `).join('')}

            `;
        }

        function getStatusBadgeClass(status) {
            switch (status) {
                case '完了':
                case '契約締結':
                    return 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                case '進行中':
                case '交渉中':
                    return 'bg-sky-50 text-sky-700 border border-sky-200';
                default:
                    return 'bg-slate-100 text-slate-600 border border-slate-200';
            }
        }

        function switchDataTab(tab) {
            currentState.activeTab = tab;
            ['tasks', 'hotels', 'logs'].forEach(t => {
                const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`);
                btn.className = (t === tab)
                    ? "px-3 sm:px-4 py-1.5 rounded-md text-xs font-semibold bg-white text-brand-600 shadow-sm transition"
                    : "px-3 sm:px-4 py-1.5 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition";
            });

            const addBtn = document.getElementById('addItemBtn');
            const addBtnText = document.getElementById('addItemBtnText');
            if (tab === 'tasks') {
                addBtnText.innerText = "新規タスク追加";
                addBtn.style.display = "flex";
            } else if (tab === 'hotels') {
                addBtnText.innerText = "新規ホテル・企業追加";
                addBtn.style.display = "flex";
            } else {
                addBtn.style.display = "none";
            }

            renderDashboardData();
        }

        /* 📝 モーダル & フォーム処理 */

            document.getElementById('dataModal').classList.add('hidden');

        function openEditTaskModal(id) {

            document.getElementById('formItemType').value = 'tasks';

            container.innerHTML = `
                <div>

                    <input type="text" id="fieldTitle" value="${escapeHtml(item.title)}" required class="w-full p-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none">

        async function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('formItemType').value;
            const id = document.getElementById('formItemId').value;
            const isEdit = Boolean(id);

            let payload = {};
            if (type === 'tasks') {
                payload = {
                    title: document.getElementById('fieldTitle').value,
                    team_assignee: document.getElementById('fieldTeamAssignee').value,
                    due: document.getElementById('fieldDue').value,
                    status: document.getElementById('fieldStatus').value,
                    description: document.getElementById('fieldDescription').value
                };
            } else if (type === 'hotels') {
                payload = {
                    name: document.getElementById('fieldHotelName').value,
                    contact_person: document.getElementById('fieldHotelClientAssignee').value,
                    team_assignee: document.getElementById('fieldHotelTeamAssignee').value,
                    location: document.getElementById('fieldHotelLocation').value,
                    status: document.getElementById('fieldHotelStatus').value,
                    description: document.getElementById('fieldHotelDescription').value
                };
            }

            const url = isEdit ? `${API_BASE}/api/${type}/${id}` : `${API_BASE}/api/${type}`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method,
                    headers: getAuthHeaders(),
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeDataModal();
                    fetchDashboardData();
                } else {
                    alert("保存に失敗しました。");
                }
            } catch (err) {
                console.error("Save Error:", err);
                alert("通信エラーが発生しました。");
            }
        }

        async function deleteItem(type, id) {
            if (!confirm("本当に削除しますか？")) return;

            try {
                const res = await fetch(`${API_BASE}/api/${type}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.ok) {
                    fetchDashboardData();
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (err) {
                console.error("Delete Error:", err);
                alert("通信エラーが発生しました。");
            }
        }
    </script>
